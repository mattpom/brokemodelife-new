name: Fix Footer Sitewide
on:
  workflow_dispatch:
  jobs:
    fix-footer:
        runs-on: ubuntu-latest
            permissions:
                  contents: write
                      steps:
                            - uses: actions/checkout@v4
                                  - name: Fix footers
                                          run: |
                                                    python3 << 'EOF'
                                                              import re, os
                                                                        BRAND = '''  <div>
                                                                                    <div class="footer-brand">Broke Mode Life</div>
                                                                                                <div class="footer-tagline">Live Large on a Lean Budget</div>
                                                                                                          </div>
                                                                                                                    '''
                                                                                                                              for fn in os.listdir('.'):
                                                                                                                                          if not fn.endswith('.html') or fn == 'index.html':
                                                                                                                                                        continue
                                                                                                                                                                    with open(fn) as f:
                                                                                                                                                                                  c = f.read()
                                                                                                                                                                                              if 'footer-brand' in c:
                                                                                                                                                                                                            continue
                                                                                                                                                                                                                        c = c.replace('<footer>\n  <div class="footer-links">', '<footer>\n' + BRAND + '  <div class="footer-links">')
                                                                                                                                                                                                                                    c = re.sub(r'All Rights Reserved\.<br>\s*<a href="affiliate\.html">Affiliate Disclosure</a> &mdash; Some links earn commission at no cost to you\.', 'All Rights Reserved. Some links earn commission at no cost to you.', c)
                                                                                                                                                                                                                                                with open(fn, 'w') as f:
                                                                                                                                                                                                                                                              f.write(c)
                                                                                                                                                                                                                                                                          print(f'Fixed {fn}')
                                                                                                                                                                                                                                                                                    EOF
                                                                                                                                                                                                                                                                                          - name: Commit
                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                            git config user.name 'github-actions[bot]'
                                                                                                                                                                                                                                                                                                                      git config user.email 'github-actions[bot]@users.noreply.github.com'
                                                                                                                                                                                                                                                                                                                                git add -A
                                                                                                                                                                                                                                                                                                                                          git diff --staged --quiet || git commit -m 'Fix footer sitewide: add brand/tagline, fix affiliate link'
                                                                                                                                                                                                                                                                                                                                                    git push
                                                                                                                                                                                                                                                                                                                                                    
