name: BML Content Publisher

on:
  schedule:
    - cron: '0 9 * * 4/14'
    - cron: '0 13 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Find and publish draft
        run: |
          if ! ls _drafts/*.html > /dev/null 2>&1; then
            echo "::warning::No drafts found in _drafts/ - add next article before scheduled run"
            exit 0
          fi
          DRAFT=$(ls _drafts/*.html | sort | head -1)
          DRAFT_NAME=$(basename "$DRAFT")
          cp "$DRAFT" "$DRAFT_NAME"
          rm "$DRAFT"
          TITLE=$(grep -oP '(?<=<title>)[^<]+' "$DRAFT_NAME" | sed "s/ — Broke.*//")
          TODAY=$(date +"%B %-d, %Y")
          TODAY_ISO=$(date +"%Y-%m-%d")
          echo "Publishing: $DRAFT_NAME | $TITLE | $TODAY"
          if [ -f blog.html ]; then
            NEW_CARD="          <a class=\"blog-card\" href=\"$DRAFT_NAME\"><span class=\"blog-source\">BML Original<\/span><span class=\"blog-title\">$TITLE<\/span><span class=\"blog-desc\">Published $TODAY<\/span><\/a>"
            sed -i "s|class=\"blog-grid\"|class=\"blog-grid\">\n$NEW_CARD\n<!--BLOGGRID|" blog.html
          fi
          if [ -f sitemap.xml ]; then
            NEW_URL="  <url>\n    <loc>https:\/\/brokemodelife.com\/$DRAFT_NAME<\/loc>\n    <changefreq>monthly<\/changefreq>\n    <priority>0.9<\/priority>\n  <\/url>"
            sed -i "s|<\/urlset>|$NEW_URL\n<\/urlset>|" sitemap.xml
          fi
          FEED_ENTRY="    <item>\n      <title>$TITLE<\/title>\n      <link>https:\/\/brokemodelife.com\/$DRAFT_NAME<\/link>\n      <pubDate>$(date -R)<\/pubDate>\n      <guid>https:\/\/brokemodelife.com\/$DRAFT_NAME<\/guid>\n    <\/item>"
          if [ -f feed.xml ]; then
            sed -i "s|<\/channel>|$FEED_ENTRY\n  <\/channel>|" feed.xml
          else
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<rss version="2.0">' '  <channel>' '    <title>Broke Mode Life — Budget Living Articles</title>' '    <link>https://brokemodelife.com</link>' '    <description>Live large on a lean budget. Real tips, real deals, zero fluff.</description>' '    <language>en-us</language>' > feed.xml
            echo "$FEED_ENTRY" >> feed.xml
            printf '%s\n' '  </channel>' '</rss>' >> feed.xml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bi-weekly publish: $DRAFT_NAME [$TODAY_ISO]"
          git push

  bml-social-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Post to Buffer
        env:
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          PROFILE_ID: "6a0fabbd090476fb99479059"
        run: python3 bml_autopost.py
