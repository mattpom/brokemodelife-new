name: SEO checks
on:
  push:
    branches: [main]
    paths: ['**/*.html', 'sitemap.xml', 'robots.txt', 'CNAME', 'scripts/check-seo.py', '.github/workflows/seo.yml']
  pull_request:
    paths: ['**/*.html', 'sitemap.xml', 'robots.txt', 'CNAME', 'scripts/check-seo.py', '.github/workflows/seo.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check-seo.py
